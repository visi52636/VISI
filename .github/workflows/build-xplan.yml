name: Build XPLAN Windows exe

on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths: ["XPLAN/**", ".github/workflows/build-xplan.yml"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        working-directory: XPLAN
        run: python -m pip install --upgrade pyinstaller openpyxl
      - name: Build single-file windowed exe
        working-directory: XPLAN
        run: pyinstaller --onefile --windowed --name XPLAN xplan.py
      - name: Build single-file console exe (for diagnosing startup errors)
        working-directory: XPLAN
        run: pyinstaller --onefile --console --name XPLAN-console xplan.py
      - name: Upload exes as artifact
        uses: actions/upload-artifact@v4
        with:
          name: XPLAN-windows-exe
          path: |
            XPLAN/dist/XPLAN.exe
            XPLAN/dist/XPLAN-console.exe
          if-no-files-found: error
      - name: Publish exes to dist-exe branch (fetchable over git)
        shell: bash
        run: |
          mkdir -p distout && cp XPLAN/dist/XPLAN.exe XPLAN/dist/XPLAN-console.exe distout/
          cd distout
          git init -q
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          git checkout -q -b dist-exe
          git add XPLAN.exe XPLAN-console.exe
          git commit -q -m "XPLAN built exes ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" dist-exe
