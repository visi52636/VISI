name: iOS Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Pick simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = [d for runtime, ds in json.load(sys.stdin)["devices"].items() if "iOS" in runtime for d in ds]
          preferred = [d for d in devices if d["name"] == "iPhone 16 Pro"] or [d for d in devices if d["name"].startswith("iPhone")]
          print(preferred[-1]["udid"])')
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          echo "Using simulator $UDID"
      - name: Build for iOS Simulator
        run: |
          xcodebuild build \
            -project VISX.xcodeproj \
            -scheme VISX \
            -destination "id=$UDID" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO | tail -n 40
          test "${PIPESTATUS[0]}" -eq 0
      - name: Capture screenshots with sample project
        run: |
          set -x
          APP=build/Build/Products/Debug-iphonesimulator/VISX.app
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3
          xcrun simctl install "$UDID" "$APP"
          mkdir -p screenshots
          for screen in projects tour viewer drawings renders edit; do
            xcrun simctl launch "$UDID" com.visx.panoramas -VISXDemo YES -VISXScreen "$screen"
            sleep 14
            xcrun simctl io "$UDID" screenshot "screenshots/$screen.png"
            xcrun simctl terminate "$UDID" com.visx.panoramas || true
            sleep 2
          done
          ls -la screenshots
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots
      - name: Build downloadable packages
        run: |
          # Simulator build (arm64 + x86_64) for browser services such as Appetize.io.
          xcodebuild build -project VISX.xcodeproj -scheme VISX -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-sim ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO | tail -n 5
          # Unsigned device build; tools like Sideloadly sign it with the user's Apple ID.
          xcodebuild build -project VISX.xcodeproj -scheme VISX -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build-device CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" | tail -n 5
          mkdir -p packages
          (cd build-sim/Build/Products/Release-iphonesimulator && zip -qry "$GITHUB_WORKSPACE/packages/VISX-simulator.zip" VISX.app)
          mkdir -p Payload
          cp -R build-device/Build/Products/Release-iphoneos/VISX.app Payload/
          zip -qry packages/VISX.ipa Payload
          ls -la packages
      - name: Publish preview release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete preview --yes --cleanup-tag || true
          gh release create preview packages/VISX-simulator.zip packages/VISX.ipa \
            --prerelease --target "$GITHUB_SHA" --title "VIS X preview" \
            --notes "Latest preview build from ${GITHUB_REF_NAME} (${GITHUB_SHA::7}).
          - VISX-simulator.zip: upload to appetize.io to run the app in a web browser.
          - VISX.ipa: install on an iPhone from Windows or Mac with Sideloadly (signs with your Apple ID)."
      - name: Commit screenshots to branch
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add screenshots
          git diff --cached --quiet && exit 0
          git commit -m "Update app screenshots [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
